<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PdfCraft 翻譯工具</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;color:#172234;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}header{padding:15px max(18px,calc((100vw - 1200px)/2));background:#142d53;color:white;display:flex;justify-content:space-between;align-items:center;gap:12px}header a{color:#d6e8ff;text-decoration:none}main{max-width:1200px;margin:24px auto;padding:0 16px}section{background:white;border:1px solid #dde3ed;border-radius:15px;padding:18px;margin-bottom:14px}h1{font-size:21px;margin:0}h2{font-size:17px;margin:0 0 12px}p{line-height:1.55}button,select,input[type=file]{font:inherit}button{background:#145ac2;border:0;border-radius:9px;color:white;padding:10px 14px;cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}button.secondary{background:#e6edf7;color:#172234}.controls{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.controls>*{max-width:100%}select{border:1px solid #bdc8d8;border-radius:8px;padding:9px;background:white}small,.muted{color:#617083}label{display:inline-flex;gap:6px;align-items:center}.panes{display:grid;grid-template-columns:1fr 1fr;gap:14px}.pane{min-width:0;border:1px solid #d9e2f0;border-radius:12px;padding:14px;max-height:68vh;overflow:auto;background:#fff;white-space:pre-wrap;overflow-wrap:anywhere}.pane h3{font-size:14px;margin:0 0 12px;position:sticky;top:-14px;background:white;padding:12px 0;border-bottom:1px solid #e3e9f3}.paragraph{white-space:pre-wrap;margin-bottom:12px;line-height:1.65}.paragraph.trans{background:#f5f8fe;border-radius:6px;padding:8px}.paragraph:focus{outline:2px solid #3675cd}.block{padding-bottom:22px;border-bottom:1px dashed #d7e0eb;margin-bottom:22px}.preview canvas{display:block;max-width:100%;height:auto;margin:0 auto 12px;box-shadow:0 1px 5px #999}.notice{background:#fff7e9;border:1px solid #f0dfb8;padding:12px;border-radius:10px}#status{min-height:22px}progress{width:180px;max-width:100%}@media(max-width:700px){.panes{grid-template-columns:1fr}.pane{max-height:46vh}header{padding:14px}main{margin:14px auto}}
@media print{header,.controls,.notice,#status,.no-print{display:none!important}body,main,section{padding:0;margin:0;background:white;border:0}#layout{display:block}.pane{display:block;max-height:none;overflow:visible;border:0;padding:0}.pane h3{position:static}.block{break-inside:avoid}body.only-translation #originalPane{display:none}body.only-bilingual #originalPane{display:block}body.only-bilingual #layout{display:grid;grid-template-columns:1fr 1fr;gap:16px}body.only-translation #translatedPane{display:block}}
</style></head><body>
<header><h1>PdfCraft · PDF 翻譯</h1><a href="../">返回 PdfCraft</a></header>
<main><section><h2>開啟 PDF</h2><div class="controls"><input id="file" type="file" accept="application/pdf,.pdf"><label>語言 <select id="direction"><option value="en|zh-TW">英文 → 繁體中文</option><option value="zh-TW|en">繁體中文 → 英文</option><option value="en|zh-CN">英文 → 簡體中文</option></select></label></div><p class="muted">PDF 只在此瀏覽器讀取；按翻譯後，相關文字會傳送至第三方 MyMemory 翻譯服務。請勿翻譯含敏感資料的文件。</p></section>
<section><h2>翻譯模式</h2><div class="controls"><button id="selected" disabled>1 · 翻譯選取文字</button><button id="bilingual" class="secondary" disabled>2 · 雙語閱讀</button><button id="all" disabled>3 · 整份翻譯</button><button id="save" class="secondary" disabled>列印／儲存成 PDF</button><label>匯出 <select id="exportMode"><option value="translation">只有譯文</option><option value="bilingual">中英對照</option></select></label></div><p id="status" role="status" aria-live="polite">請先選擇 PDF 檔案。</p><progress id="progress" max="100" value="0" hidden></progress><div class="notice">限制：目前只處理 PDF 內可抽取的文字；掃描圖片需要先 OCR。免費翻譯服務有字數／速率限制；匯出的 PDF 會重新排版，不保證還原原文件的圖表、圖片及版面。</div></section>
<section id="documentSection" hidden><h2 id="docTitle">文件</h2><div class="controls no-print"><button id="prev" class="secondary">上一頁</button><span id="counter">1 / 1</span><button id="next" class="secondary">下一頁</button><button id="viewOriginal" class="secondary">原 PDF 預覽</button><button id="viewText" class="secondary">可選取文字</button></div><div class="panes" id="layout"><div class="pane" id="originalPane"><h3>原文（可選取文字）</h3><div id="originalContent"></div><div class="preview" id="preview" hidden></div></div><div class="pane" id="translatedPane"><h3>繁體中文譯文</h3><div id="translatedContent">翻譯後會在此顯示內容。</div></div></div></section></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id), state={pdf:null,pages:[],translations:new Map(),page:0,busy:false,mode:'text'};
const status=s=>{$('status').textContent=s}, esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
if(!window.pdfjsLib){status('無法載入 PDF.js，請確認已連線。');return}
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
function chunks(s,limit=380){const result=[];let cur='';for(const segment of s.split(/(?<=[.!?。！？\n])\s*/u)){if(segment.length>limit){if(cur.trim())result.push(cur.trim());cur='';for(let i=0;i<segment.length;i+=limit)result.push(segment.slice(i,i+limit));continue}if((cur+segment).length>limit){if(cur.trim())result.push(cur.trim());cur=''}cur+=segment+' '}if(cur.trim())result.push(cur.trim());return result}
async function translate(text){if(!text.trim())return '';const language=$('direction').value.split('|');const source=language[0],target=language[1];const results=[];for(const piece of chunks(text)){const url='https://api.mymemory.translated.net/get?q='+encodeURIComponent(piece)+'&langpair='+encodeURIComponent(source+'|'+target);const res=await fetch(url,{cache:'no-store'});if(!res.ok)throw Error('翻譯服務 HTTP '+res.status);const body=await res.json();if(body.responseStatus!==200 || !body.responseData?.translatedText)throw Error(body.responseDetails||'翻譯額度不足或服務無回應');const translated=body.responseData.translatedText;if(/MYMEMORY WARNING|QUERY LENGTH LIMIT|INVALID LANGUAGE/i.test(translated))throw Error(translated);results.push(translated);await new Promise(r=>setTimeout(r,150))}return results.join(' ')}
function buildText(items){const groups=[];let current='';let lastY=null;for(const item of items){const value=item.str||'';if(!value.trim())continue;const y=item.transform?.[5];if(lastY!==null && y!==undefined && Math.abs(lastY-y)>4){current+='\n'}current+=value+(item.hasEOL?'\n':' ');lastY=y}return current.trim()}
function show(){if(!state.pdf)return;$('counter').textContent=(state.page+1)+' / '+state.pages.length;const source=state.pages[state.page]||'';$('originalContent').textContent=source||'呢頁冇可抽取文字。';$('translatedContent').textContent=state.translations.get(state.page)||'尚未翻譯呢頁。';$('prev').disabled=state.page<=0;$('next').disabled=state.page>=state.pages.length-1}
function controls(ready){for(const id of ['selected','bilingual','all','save'])$(id).disabled=!ready}
$('file').addEventListener('change',async e=>{const f=e.target.files?.[0];if(!f)return;controls(false);state.pdf=null;state.pages=[];state.translations.clear();$('documentSection').hidden=true;status('正在讀取 PDF…');try{const buf=await f.arrayBuffer();const pdf=await pdfjsLib.getDocument({data:new Uint8Array(buf)}).promise;state.pdf=pdf;for(let p=1;p<=pdf.numPages;p++){const page=await pdf.getPage(p),text=await page.getTextContent();state.pages.push(buildText(text.items));status('讀取頁面 '+p+' / '+pdf.numPages)}state.page=0;$('docTitle').textContent=f.name;$('documentSection').hidden=false;controls(true);show();status('已載入 '+pdf.numPages+' 頁；可以選取左邊文字後按翻譯。')}catch(err){status('開啟失敗：'+err.message)}})
async function busyRun(fn){if(state.busy)return;state.busy=true;controls(false);try{await fn()}catch(e){status('翻譯失敗：'+e.message)}finally{state.busy=false;controls(!!state.pdf);$('progress').hidden=true}}
$('selected').onclick=()=>busyRun(async()=>{const s=window.getSelection()?.toString().trim();if(!s){status('請先喺左邊「可選取文字」框選英文段落。');return}if(s.length>3500){status('選取文字太長，請縮小範圍。');return}status('正在翻譯所選文字…');const translated=await translate(s);$('translatedContent').textContent='原文：\n'+s+'\n\n翻譯：\n'+translated;status('選取文字翻譯完成（不會取代整頁譯文）。')});
$('bilingual').onclick=()=>busyRun(async()=>{if(!state.pages[state.page].trim()){status('此頁無可抽取文字，請先用 OCR 處理。');return}status('正在翻譯第 '+(state.page+1)+' 頁…');state.translations.set(state.page,await translate(state.pages[state.page]));show();status('第 '+(state.page+1)+' 頁翻譯完成。左右可對照閱讀。')});
$('all').onclick=()=>busyRun(async()=>{const total=state.pages.length;$('progress').hidden=false;for(let i=0;i<total;i++){if(!state.translations.has(i)){if(state.pages[i].trim())state.translations.set(i,await translate(state.pages[i]));else state.translations.set(i,'〔無可抽取文字，請先 OCR〕')} $('progress').value=Math.round((i+1)/total*100);status('整份翻譯 '+(i+1)+' / '+total+' 頁');}show();status('全份翻譯完成，可以列印或儲存成 PDF。')});
$('prev').onclick=()=>{state.page--;show()};$('next').onclick=()=>{state.page++;show()};
$('direction').onchange=()=>{state.translations.clear();show();status('翻譯方向已更改，請重新翻譯。')};
$('viewText').onclick=()=>{$('preview').hidden=true;$('originalContent').hidden=false};
$('viewOriginal').onclick=async()=>{if(!state.pdf)return;status('正在顯示 PDF 預覽…');try{const page=await state.pdf.getPage(state.page+1);const viewport=page.getViewport({scale:1.35}),canvas=document.createElement('canvas');canvas.width=viewport.width;canvas.height=viewport.height;await page.render({canvasContext:canvas.getContext('2d'),viewport}).promise;const el=$('preview');el.replaceChildren(canvas);el.hidden=false;$('originalContent').hidden=true;status('正在預覽；如需選取文字，按「可選取文字」。')}catch(e){status('預覽失敗：'+e.message)}};
$('save').onclick=()=>{if(state.translations.size===0){status('請先翻譯一頁或整份文件。');return}const savedPage=state.page;const orig=$('originalContent'),trans=$('translatedContent');const oldOrig=orig.innerHTML,oldTrans=trans.innerHTML;const printOrig=state.pages.map((s,i)=>'<article class="block"><h4>Page '+(i+1)+'</h4><div class="paragraph">'+esc(s)+'</div></article>').join('');const printTrans=state.pages.map((s,i)=>'<article class="block"><h4>第 '+(i+1)+' 頁</h4><div class="paragraph trans">'+esc(state.translations.get(i)||'〔未翻譯〕')+'</div></article>').join('');orig.innerHTML=printOrig;trans.innerHTML=printTrans;document.body.classList.add('only-'+$('exportMode').value);$('preview').hidden=true;orig.hidden=false;const restore=()=>{orig.innerHTML=oldOrig;trans.innerHTML=oldTrans;document.body.classList.remove('only-translation','only-bilingual');state.page=savedPage;show();window.removeEventListener('afterprint',restore)};window.addEventListener('afterprint',restore);window.print();setTimeout(()=>{if(document.body.classList.contains('only-translation')||document.body.classList.contains('only-bilingual'))restore()},3000)};
})();
</script></body></html>
